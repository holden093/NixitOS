# AriaOS: riserva la eGPU a vfio-pci nell'initramfs (device presente a boot) ed
# esclude qualunque modulo NVIDIA host-side. La scheda non verra' mai
# inizializzata dal sistema: passa esclusivamente alla VM llama-vm.
force_drivers+=" vfio vfio_iommu_type1 vfio_pci "
omit_drivers+=" nvidia nvidia_modeset nvidia_uvm nvidia_drm nouveau "
install_items+=" /etc/modprobe.d/blacklist-nvidia.conf "
