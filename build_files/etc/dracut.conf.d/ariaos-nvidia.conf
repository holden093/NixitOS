# AriaOS: la eGPU NVIDIA non viene mai inizializzata dall'host durante il boot.
# L'initramfs esclude qualunque modulo NVIDIA o nouveau; il driver viene caricato
# on-demand da ariaos-egpu.service solo quando serve l'inferenza CUDA.
omit_drivers+=" nvidia nvidia_modeset nvidia_uvm nvidia_drm nouveau "
install_items+=" /etc/modprobe.d/blacklist-nvidia.conf "
