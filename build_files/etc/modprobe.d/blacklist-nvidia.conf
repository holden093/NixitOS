# AriaOS: policy NVIDIA compute-only.
#
# Il percorso display (nvidia_drm, nvidia_modeset) e nouveau non devono MAI
# essere caricati: nvidia_drm registrerebbe un nodo DRM che GNOME enumererebbe,
# portando la sessione a "rubare" la eGPU e impedendo lo scaricamento a caldo.
# Questi tre moduli sono bloccati anche esplicitamente.
install nvidia_drm /bin/false
install nvidia_modeset /bin/false
install nouveau /bin/false

# nvidia e nvidia_uvm sono on-demand (solo calcolo CUDA): nessun autoload,
# ma il caricamento esplicito da ariaos-egpu.service deve funzionare.
blacklist nvidia
blacklist nvidia_uvm

# Nessuna memoria video da preservare alla sospensione: la eGPU e' on-demand.
options nvidia NVreg_PreserveVideoMemoryAllocations=0
