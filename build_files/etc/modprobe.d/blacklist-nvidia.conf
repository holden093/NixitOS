# AriaOS: blocco totale dei driver NVIDIA sull'host.
# La scheda passa interamente alla VM llama-vm via vfio-pci; questi moduli
# devono restare non caricabili, anche se qualcuno li installasse manualmente.
blacklist nouveau
blacklist nvidia
blacklist nvidia_uvm
blacklist nvidia_drm
blacklist nvidia_modeset

# Impedisce il caricamento anche esplicitamente
install nvidia /bin/false
install nvidia_uvm /bin/false
install nouveau /bin/false
install nvidia_drm /bin/false
install nvidia_modeset /bin/false
