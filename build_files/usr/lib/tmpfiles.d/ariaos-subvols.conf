# Crea il subvolume Btrfs per i giochi, separandoli dagli snapshot di /var/home.
# I membri di aria-games possono usare il subvolume senza un account hardcoded.
v /var/games 2775 root aria-games - -

# Subvolume per la VM AI (llama-vm): disco qcow2 e modelli GGUF, gestiti dall'host.
v /var/vms 0755 root root - -
d /var/vms/models 0755 root root - -
d /var/vms/llama 0755 root root - -
