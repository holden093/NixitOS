# AriaOS LLM backend configuration.
#
# Default distribuito con l'immagine. Per dichiarare i tuoi launcher, copia
# questo file in /etc/ariaos/llm.conf (che ha precedenza) e compila i comandi
# START/STOP. L'immagine non contiene ne' motori ne' modelli: ogni backend
# delega l'avvio del server a un comando tuo (es. un launcher in un toolbox).
#
# INTEL_START/STOP: server llama.cpp backend Vulkan su Intel Arc.
# NVIDIA_START/STOP: server llama.cpp backend CUDA sulla eGPU (dopo ariaos llm
# nvidia up, che carica driver e spec CDI). I comandi girano come utente.

INTEL_PORT=8080
INTEL_HEALTH=http://127.0.0.1:8080/health
INTEL_START=
INTEL_STOP=

NVIDIA_PORT=8081
NVIDIA_HEALTH=http://127.0.0.1:8081/health
NVIDIA_START=
NVIDIA_STOP=
